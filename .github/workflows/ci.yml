name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - run: rustup component add rust-src
      - run: cargo fmt --all -- --check
      - name: Validate and inventory requirement evidence
        run: uv run --script scripts/check-requirements.py --report target/evidence/requirements.json
      - name: Upload requirement evidence inventory
        uses: actions/upload-artifact@v4
        with:
          name: requirement-evidence
          path: target/evidence/requirements.json
      - run: cargo test --locked --target x86_64-unknown-linux-gnu
      - run: cargo clippy -Zbuild-std=core --target riscv32imfc-unknown-none-elf -- -D warnings
      - run: cargo build -Zbuild-std=core --target riscv32imfc-unknown-none-elf
      - name: Check WS63 scheduler port
        run: cargo clippy --locked -Zbuild-std=core --target riscv32imfc-unknown-none-elf --features chip-ws63 -- -D warnings
      - name: Check WS63 scheduler port with Embassy time
        run: cargo build --locked -Zbuild-std=core --target riscv32imfc-unknown-none-elf --features chip-ws63,embassy

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify budget accounting invariant
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness remaining_never_exceeds_capacity"
      - name: Verify stale resource generations cannot alias
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness stale_resource_generation_never_aliases_reused_slot"
      - name: Verify destroyed resource handles fail closed
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness destroyed_resource_handle_cannot_be_resolved_twice"
      - name: Verify signal-cancel wait races preserve ownership and permits
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness semaphore_signal_cancel_race_preserves_queue_ownership_and_permit"
      - name: Verify signal-timeout wait races preserve ownership and permits
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness semaphore_signal_timeout_race_preserves_queue_ownership_and_permit"
      - name: Verify mutex handoff preserves priority FIFO and inheritance
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness mutex_handoff_preserves_priority_fifo_and_restores_owner"
      - name: Verify mutex wait chains reject cycles
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness mutex_wait_chain_rejects_cycles"
      - name: Verify switch intents are consumed at most once
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness switch_intent_is_consumed_at_most_once"
      - name: Verify stale switch identities cannot commit
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness stale_switch_identity_cannot_commit"
      - name: Verify resumed tasks cancel stale switch intents
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness resumed_previous_cancels_intent_and_restores_target"
      - name: Verify switch-away creation is an atomic prepare-or-observe decision
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness switch_away_prepare_or_observe_resume_is_atomic"
      - name: Verify stale timer tickets cannot validate
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--harness stale_timer_rearm_ticket_cannot_validate_after_new_claim"

  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned TLA+ tools
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output /tmp/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" \
            | sha256sum --check
      - name: Check scheduler budget model
        working-directory: spec
        run: |
          mkdir -p ../target/evidence/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 4 -config SchedulerBudget.cfg SchedulerBudget.tla \
            | tee ../target/evidence/tla/SchedulerBudget.log
      - name: Check resource lifecycle model
        working-directory: spec
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 4 -config ResourceLifecycle.cfg ResourceLifecycle.tla \
            | tee ../target/evidence/tla/ResourceLifecycle.log
      - name: Check wait linearization model
        working-directory: spec
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 4 -config WaitLinearization.cfg WaitLinearization.tla \
            | tee ../target/evidence/tla/WaitLinearization.log
      - name: Check priority inheritance model
        working-directory: spec
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 4 -config PriorityInheritance.cfg PriorityInheritance.tla \
            | tee ../target/evidence/tla/PriorityInheritance.log
      - name: Check timer re-arm model
        working-directory: spec
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 4 -config TimerRearm.cfg TimerRearm.tla \
            | tee ../target/evidence/tla/TimerRearm.log
      - name: Check switch-intent model
        working-directory: spec
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 4 -config SwitchIntent.cfg SwitchIntent.tla \
            | tee ../target/evidence/tla/SwitchIntent.log
      - name: Check switch-intent creation decision model
        working-directory: spec
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 4 \
            -config SwitchIntentCreation.cfg SwitchIntentCreation.tla \
            | tee ../target/evidence/tla/SwitchIntentCreation.log
      - name: Prove the legacy two-phase creation design has a counterexample
        working-directory: spec
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC -workers 1 \
            -config SwitchIntentCreationLegacy.cfg SwitchIntentCreation.tla \
            > ../target/evidence/tla/SwitchIntentCreationLegacy.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F "Invariant PreparedSourceNotResumed is violated" \
            ../target/evidence/tla/SwitchIntentCreationLegacy.log
      - name: Upload TLA+ state-space evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-state-space-evidence
          path: target/evidence/tla

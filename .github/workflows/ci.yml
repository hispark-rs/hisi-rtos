name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - run: rustup component add rust-src
      - run: cargo fmt --all -- --check
      - name: Validate and inventory requirement evidence
        run: uv run --script scripts/check-requirements.py --report target/evidence/requirements.json
      - name: Exercise negative evidence contracts
        run: uv run --script scripts/test-requirement-evidence.py
      - name: Build proof contract
        run: uv run --script scripts/proof-evidence.py contract --output target/evidence/proof-contract.json
      - name: Upload requirement and proof contracts
        uses: actions/upload-artifact@v4
        with:
          name: requirement-evidence-contract
          path: |
            target/evidence/requirements.json
            target/evidence/proof-contract.json
      - run: cargo test --locked --target x86_64-unknown-linux-gnu
      - run: cargo clippy -Zbuild-std=core --target riscv32imfc-unknown-none-elf -- -D warnings
      - run: cargo build -Zbuild-std=core --target riscv32imfc-unknown-none-elf
      - name: Check WS63 scheduler port
        run: cargo clippy --locked -Zbuild-std=core --target riscv32imfc-unknown-none-elf --features chip-ws63 -- -D warnings
      - name: Check WS63 scheduler port with Embassy time
        run: cargo build --locked -Zbuild-std=core --target riscv32imfc-unknown-none-elf --features chip-ws63,embassy

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Kani
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          args: "--version"
      - name: Execute every contracted harness and verify receipts
        run: |
          uv run --script scripts/proof-evidence.py contract --output target/evidence/proof-contract.json
          uv run --script scripts/proof-evidence.py run-kani --contract target/evidence/proof-contract.json --logs target/evidence/kani
          uv run --script scripts/proof-evidence.py record-kani --contract target/evidence/proof-contract.json --logs target/evidence/kani --output target/evidence/kani-run.json
      - name: Upload Kani execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-proof-evidence
          path: target/evidence
          if-no-files-found: error

  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Download pinned TLA+ tools
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output /tmp/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" \
            | sha256sum --check
      - name: Execute models and legacy counterexamples and verify receipts
        run: |
          uv run --script scripts/proof-evidence.py contract --output target/evidence/proof-contract.json
          uv run --script scripts/proof-evidence.py run-tla --contract target/evidence/proof-contract.json --logs target/evidence/tla
          uv run --script scripts/proof-evidence.py record-tla --contract target/evidence/proof-contract.json --logs target/evidence/tla --output target/evidence/tla-run.json
      - name: Upload TLA+ execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-state-space-evidence
          path: target/evidence
          if-no-files-found: error
